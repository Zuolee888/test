<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <rect width="1080" height="720" fill="#ffffff"/>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="26" font-weight="700" fill="#111827">一条程序，四次变身</text>
  <text x="40" y="78" font-size="14" fill="#6b7280">同一个类：文本 → 字节码 → dex → 手机上的可执行文件；旁边那个 smali，是 dex 的另一种写法</text>

  <!-- 主流水线 -->
  <rect x="40" y="112" width="200" height="118" rx="10" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="2"/>
  <text x="56" y="148" font-size="17" font-weight="700" fill="#1e3a5f">Foo.java</text>
  <text x="56" y="174" font-size="12.5" fill="#4b5563">人能读懂的源代码</text>
  <text x="56" y="202" font-size="11.5" fill="#3b6fb6">产自：程序员（你）</text>

  <line x1="244" y1="171" x2="292" y2="171" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="268" y="160" font-size="11" fill="#374151" text-anchor="middle">javac</text>

  <rect x="300" y="112" width="200" height="118" rx="10" fill="#e8f0fe" stroke="#3b6fb6" stroke-width="2"/>
  <text x="316" y="148" font-size="17" font-weight="700" fill="#1e3a5f">Foo.class</text>
  <text x="316" y="174" font-size="12.5" fill="#4b5563">字节码 · 栈式指令</text>
  <text x="316" y="202" font-size="11.5" fill="#3b6fb6">产自：javac</text>

  <line x1="504" y1="171" x2="552" y2="171" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="528" y="160" font-size="11" fill="#374151" text-anchor="middle">d8</text>

  <rect x="560" y="112" width="200" height="118" rx="10" fill="#e9f9f0" stroke="#2e8b57" stroke-width="2"/>
  <text x="576" y="148" font-size="17" font-weight="700" fill="#14503a">classes.dex</text>
  <text x="576" y="174" font-size="12.5" fill="#4b5563">DEX 字节码 · 寄存器式</text>
  <text x="576" y="202" font-size="11.5" fill="#2e8b57">产自：d8 或 R8</text>

  <line x1="764" y1="171" x2="812" y2="171" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="788" y="160" font-size="11" fill="#374151" text-anchor="middle">打包</text>

  <rect x="820" y="112" width="220" height="118" rx="10" fill="#f4ecfb" stroke="#7d3c98" stroke-width="2"/>
  <text x="836" y="148" font-size="17" font-weight="700" fill="#3d1d6b">app.apk</text>
  <text x="836" y="174" font-size="12" fill="#4b5563">ZIP 压缩包：代码＋资源＋签名</text>
  <text x="836" y="202" font-size="10.5" fill="#7d3c98">aapt2 / zipflinger / apksigner</text>

  <!-- dex ⇄ smali -->
  <line x1="660" y1="244" x2="660" y2="300" stroke="#d68910" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="653,248 667,248 660,236" fill="#d68910"/>
  <polygon points="653,296 667,296 660,308" fill="#d68910"/>

  <rect x="560" y="310" width="200" height="100" rx="10" fill="#fff3e0" stroke="#d68910" stroke-width="2"/>
  <text x="576" y="344" font-size="17" font-weight="700" fill="#7a4a05">Foo.smali</text>
  <text x="576" y="370" font-size="12.5" fill="#4b5563">dex 的纯文本写法</text>
  <text x="576" y="396" font-size="11.5" fill="#d68910">baksmali ⇄ smali</text>

  <!-- APK 安装后 -->
  <line x1="930" y1="244" x2="930" y2="300" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="820" y="310" width="220" height="100" rx="10" fill="#f7f7fb" stroke="#5b5b8a" stroke-width="2"/>
  <text x="836" y="342" font-size="14" font-weight="700" fill="#2f2f52">手机上真正在跑的</text>
  <text x="836" y="368" font-size="12" fill="#4b5563">base.apk → oat/base.oat</text>
  <text x="836" y="392" font-size="11.5" fill="#5b5b8a">dex2oat 在安装时做的</text>

  <!-- 认知提示条 -->
  <rect x="40" y="440" width="1000" height="76" rx="8" fill="#fffbe6" stroke="#d4a017" stroke-width="1.5"/>
  <text x="60" y="470" font-size="14" font-weight="700" fill="#7a5c00">一句话记住：smali 不是流水线上的新一站</text>
  <text x="60" y="496" font-size="13" fill="#4b5563">它是 classes.dex 的另一种表达方式 —— 同一个东西，一个存成二进制，一个写成文本，两者可以来回转换，信息几乎不丢。</text>

  <!-- 三个时期 -->
  <rect x="40" y="540" width="320" height="140" rx="10" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
  <text x="60" y="572" font-size="15" font-weight="700" fill="#1e3a5f">① 编译期 · 在你的电脑上</text>
  <text x="60" y="600" font-size="12.5" fill="#4b5563">javac 读懂 .java 的每一行</text>
  <text x="60" y="624" font-size="12.5" fill="#4b5563">生成 .class：类结构＋指令</text>
  <text x="60" y="648" font-size="12.5" fill="#4b5563">此时还跟 Android 无关</text>

  <rect x="400" y="540" width="320" height="140" rx="10" fill="#e9f9f0" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="420" y="572" font-size="15" font-weight="700" fill="#14503a">② 打包期 · 还是在电脑上</text>
  <text x="420" y="600" font-size="12.5" fill="#4b5563">d8/R8 把 .class 翻成 dex</text>
  <text x="420" y="624" font-size="12.5" fill="#4b5563">aapt2 编译清单和资源</text>
  <text x="420" y="648" font-size="12.5" fill="#4b5563">zipflinger 压包，apksigner 签名</text>

  <rect x="760" y="540" width="280" height="140" rx="10" fill="#f4ecfb" stroke="#7d3c98" stroke-width="1.5"/>
  <text x="780" y="572" font-size="15" font-weight="700" fill="#3d1d6b">③ 运行期 · 在手机上</text>
  <text x="780" y="600" font-size="12.5" fill="#4b5563">安装时 dex2oat 预编译</text>
  <text x="780" y="624" font-size="12.5" fill="#4b5563">ART 执行 dex 或 oat</text>
  <text x="780" y="648" font-size="12.5" fill="#4b5563">ART = Android Runtime</text>
</svg>
